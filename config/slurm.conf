# mini-eda SLURM controller/compute config — learning lab (Slurm 23.11.x)
# Same file must be present at /etc/slurm/slurm.conf on ALL nodes.

ClusterName=mini-eda
SlurmctldHost=controller          # where slurmctld runs; must resolve (via /etc/hosts)

SlurmUser=slurm                   # slurmctld runs as unprivileged 'slurm'
SlurmdUser=root                   # slurmd runs as root: it launches jobs as any user + drives cgroups

# --- Authentication (relies on the shared MUNGE key we distributed) ---
AuthType=auth/munge
CredType=cred/munge

# --- Accounting: explicitly OFF (this lab has no slurmdbd) ---
# accounting_storage/none = no accounting DB. We do NOT set AccountingStorageEnforce at all
# (its default is no enforcement; the literal value "none" is rejected by the parser).
AccountingStorageType=accounting_storage/none

# --- State & spool ---
StateSaveLocation=/var/spool/slurmctld   # slurmctld's durable cluster state (queue, node states)
SlurmdSpoolDir=/var/spool/slurmd         # per-node slurmd working dir

# --- Logs & pid files (pid paths match the Debian/Ubuntu systemd units) ---
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid

MpiDefault=none
ReturnToService=2                 # let a node come back to service automatically after it re-registers

# How long the controller waits for a slurmd heartbeat before marking the node DOWN.
# Default is 300s. Lab uses 30s so a killed slurmd is visible fast. Production: tune carefully —
# too low = transient network blips falsely mark healthy nodes down (risk of mass false-drain).
SlurmdTimeout=30

# --- Scheduling ---
SchedulerType=sched/backfill      # run lower-priority jobs early IF they don't delay higher-priority ones
# On this distro build (no slurmdbd) the MAIN scheduler skips batch jobs with a cosmetic
# "invalid account"; the BACKFILL scheduler places them anyway. Tighten backfill to ~5s so
# queued sbatch jobs start promptly instead of waiting the default 30s cycle. (Tiny lab.)
SchedulerParameters=bf_interval=5
SelectType=select/cons_tres       # allocate individual consumable resources (CPUs, memory), not whole nodes
SelectTypeParameters=CR_CPU_Memory  # schedulable units = logical CPUs + memory (see note below)

# --- Resource enforcement via cgroups ---
ProctrackType=proctrack/cgroup    # track/kill a job's processes as a cgroup
TaskPlugin=task/cgroup,task/affinity
JobAcctGatherType=jobacct_gather/cgroup
JobAcctGatherFrequency=30

# --- Node health checking ---
# Each compute node runs this program every interval; if it exits non-zero (and drains itself),
# the scheduler stops placing new work there. CYCLE staggers checks across nodes over the
# interval instead of all-at-once (avoids a "thundering herd" of simultaneous checks at scale).
HealthCheckProgram=/usr/local/sbin/slurm-healthcheck.sh
HealthCheckInterval=30
HealthCheckNodeState=ANY,CYCLE

# --- Nodes & partition ---
# From `slurmd -C`: CPUs=2 (1 core x 2 threads), RealMemory=909. We declare 800 to
# leave the OS headroom, and never claim more than the hardware actually has.
NodeName=compute-[01-02] CPUs=2 RealMemory=800 State=UNKNOWN

PartitionName=eda Nodes=compute-[01-02] Default=YES MaxTime=INFINITE State=UP
