# cgroup enforcement config — present at /etc/slurm/cgroup.conf on the compute nodes.
# Ubuntu 24.04 uses cgroup v2; autodetect lets Slurm pick the right generation.

CgroupPlugin=autodetect
ConstrainCores=yes      # a job can only use the CPU cores it was allocated
ConstrainRAMSpace=yes   # a job is held to its allocated memory (kernel-enforced)
